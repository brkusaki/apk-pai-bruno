<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1b24">
<title>Maya</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="topo">
  <div>
    <div id="saudacao">Olá</div>
    <div id="subtitulo"></div>
  </div>
  <div class="botoes"><button id="btnTema" class="icone" aria-label="Trocar tema claro/escuro"></button><button id="btnMais" class="icone" aria-label="Configurações"></button></div>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-tab="inicio" data-ic="house">Início</button>
  <button data-tab="guia" data-ic="book-open">Guia</button>
  <button data-tab="rotina" data-ic="baby">Rotina</button>
  <button data-tab="pedidos" data-ic="clipboard-list">Pedidos</button>
  <button data-tab="estoque" data-ic="package">Estoque</button>
  <button data-tab="diario" data-ic="notebook-pen">Diário</button>
</nav>
<div id="passo" hidden>
  <div class="passo-topo"><small id="passoT"></small><button id="passoX" class="icone" aria-label="Fechar">✕</button></div>
  <div id="passoN" class="passo-num"></div>
  <div id="passoTxt" class="passo-txt"></div>
  <div class="passo-bt"><button id="passoA" class="btn sec">Anterior</button><button id="passoP" class="btn">Próximo</button></div>
</div>
<div id="modal" hidden><div id="modalBox"></div></div>
<div id="toast" hidden></div>
<div id="luz" hidden>
  <div id="luzHora" class="luz-hora">00:00</div>
  <div class="luz-sub">Modo plantão · luz vermelha</div>
  <div id="luzPainel"></div>
  <div id="luzFala" class="luz-fala"></div>
  <div class="luz-fim">
    <label class="luz-brilho">Brilho<input id="luzBrilho" type="range" min="8" max="100" value="45"></label>
    <div class="luz-bts"><button id="luzMic" class="luz-sair" aria-label="Falar com o assistente">🎤 Falar</button><button id="luzSair" class="luz-sair">Sair</button></div>
  </div>
</div>
<button id="micFab" aria-label="Assistente de voz">🎤</button>
<div id="voz" hidden>
  <div class="voz-topo"><b id="vozNome">🎤 Assistente</b><button id="vozX" class="icone" aria-label="Fechar">✕</button></div>
  <div id="vozLog"></div>
  <div id="vozChips" class="chips"></div>
  <div id="vozEstado" class="voz-estado"></div>
  <div class="voz-ctl"><button id="vozMic" class="voz-mic" aria-label="Falar">🎤</button><button id="vozParar" class="btn sec mini">Calar</button><button id="vozTeste" class="btn sec mini">🔧 Testar</button></div>
  <form id="vozForm" class="addlinha"><input id="vozTxt" placeholder="Ou digite um comando" autocomplete="off"><button class="btn">Enviar</button></form>
  <div id="vozOpt"></div>
</div>
<script src="versao.js"></script>
<script src="icones.js"></script>
<script src="data.js"></script>
<script src="data2.js"></script>
<script src="data3.js"></script>
<script src="data4.js"></script>
<script src="data5.js"></script>
<script src="data6.js"></script>
<script src="data7.js"></script>
<script src="app.js"></script>
</body>
</html>
